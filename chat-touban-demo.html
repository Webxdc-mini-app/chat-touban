function warnings(sid,pid){const out=[];if(read('person',pid,'active')==='いいえ')out.push('活動休止中');if(nightWork(sid)&&read('person',pid,'night')==='不可')out.push('夜間不可');const range=shiftInterval(sid);for(const other of keys('shift')){if(other===sid||!committed(read('duty',other+'~'+pid,'state')))continue;const r=shiftInterval(other);if(C.overlap(range,r))out.push('時間重複：'+read('shift',other,'title'));else if(range&&r&&(range[1]===r[0]||r[1]===range[0]))out.push('連続当番：'+read('shift',other,'title'));}return out;}
function weekStats(pid){const days=C.week(filter||localDate());let planned=0,done=0,hours=0;for(const sid of keys('shift')){if(!days.includes(read('shift',sid,'date')))continue;const state=read('duty',sid+'~'+pid,'state');if(committed(state)){planned++;if(state==='参加済み')done++;const r=shiftInterval(sid);if(r)hours+=(r[1]-r[0])/3600000;}}return {planned,done,hours};}

function dateTools(){const today=localDate();return `<div class="date-controls">${[0,1,2].map((n)=>{const d=C.addDays(today,n);return `<button class="small ${filter===d?'active':''}" data-action="date" data-id="${d}">${h(t(['today','tomorrow','dayAfter'][n]))}</button>`;}).join('')}<label class="visually-hidden" for="datefilter">${h(t('date'))}</label><input id="datefilter" type="date" value="${h(filter)}"><button class="small ${!filter?'active':''}" data-action="alldates">${h(t('allDays'))}</button></div>`;}
function slotSummary(s){const ids=keys('shift').filter(id=>(!filter||read('shift',id,'date')===filter)&&shiftSlot(id)===s&&read('shift',id,'closed')!=='はい'),req=ids.reduce((n,id)=>n+needed(id),0),count=ids.reduce((n,id)=>n+Math.min(needed(id),safeAssigned(id).length),0),short=ids.reduce((n,id)=>n+shortage(id),0);return `<button class="slot-card ${s===slot?'active':''} ${short?'bad':'good'}" data-action="slot" data-id="${s}" aria-pressed="${s===slot}"><span class="slot-title">${h(t(s))}<small><bdi>${slots[s].time}</bdi></small></span><span class="numbers"><strong>${count}</strong> / ${req}</span><span class="progress"><i style="width:${req?Math.min(100,Math.round(count/req*100)):0}%"></i></span><span class="slot-note">${h(ids.length===0?t('noShifts'):short?t('shortage',{n:short}):req===0?t('noAssignment'):t('filled'))} · ${ids.length} ${h(t('roles'))}</span></button>`;}
function heatmap(){const stats=keys('person').map(pid=>({pid,...weekStats(pid)})),max=Math.max(1,...stats.map(s=>s.planned)),week=C.week(filter||localDate());return `<section class="card heat-card"><h3>${h(t('workload'))}</h3><p class="week-label">${h(t('weekHint',{start:week[0],end:week[6]}))}</p><p class="muted">${h(t('workloadHint'))}</p>${stats.map(s=>{const related=keys('shift').filter(id=>(!filter||read('shift',id,'date')===filter)&&shiftSlot(id)===slot&&committed(read('duty',id+'~'+s.pid,'state'))),warn=related.flatMap(id=>warnings(id,s.pid));return `<div class="heat-item ${s.planned>=5?'high':''}"><div class="heat-label"><strong dir="auto">${h(personLabel(s.pid))}</strong><span class="count">${h(t('count',{n:s.planned}))} · ${h(t('doneCount',{n:s.done}))}</span></div><div class="heat-bar"><i style="width:${Math.round(s.planned/max*100)}%"></i></div><p class="muted">${h(t('hours',{n:Number(s.hours.toFixed(1))}))}${s.planned>=5?' · '+h(t('burdenHigh')):''}</p>${warn.length?`<p class="warning-list">⚠ ${[...new Set(warn)].map(x=>h(uiWarning(x))).join(' / ')}</p>`:''}</div>`;}).join('')||`<p class="muted">${h(t('peopleEmpty'))}</p>`}<p class="muted">${h(t('discuss'))}</p></section>`;}
function rosterMini(){const p=activePeople();return `<section class="card mini-list"><div class="section-heading"><h3>${h(t('people'))} ${p.length}</h3><button class="small" data-action="newperson">${h(t('register'))}</button></div>${p.slice(0,12).map(id=>`<div class="item"><strong dir="auto">${h(personLabel(id))}</strong>${read('person',id,'night')==='不可'?` <span class="badge">${h(t('nightNo'))}</span>`:''}<p class="muted" dir="auto">${h(read('person',id,'skills')||t('noSkills'))}</p></div>`).join('')||`<p class="muted">${h(t('noPeople'))}</p>`}<p class="muted">${h(t('personIdHint'))}</p></section>`;}
function demoPanel(){return window.ROTA_PREVIEW?`<section class="warn"><div class="section-heading"><div><strong>${h(t('demoMode'))}</strong><p class="muted">${h(t('demoPrivacy'))}</p></div><button class="small" data-action="demo">${h(t('demoAdd'))}</button></div></section>`:'';}
function board(){const ids=keys('shift').filter(id=>(!filter||read('shift',id,'date')===filter)&&shiftSlot(id)===slot).sort((a,b)=>(read('shift',a,'date')+read('shift',a,'start')).localeCompare(read('shift',b,'date')+read('shift',b,'start'))),notes=keys('note').filter(noteForScope).sort((a,b)=>(C.tips(events,'note',b,'text').at(-1)?.clock||0)-(C.tips(events,'note',a,'text').at(-1)?.clock||0));return `<div class="toolbar"><div><h2>${h(t('board'))}</h2><p class="muted">${h(t('participantHint'))}</p></div>${dateTools()}</div><div class="slot-grid">${Object.keys(slots).map(slotSummary).join('')}</div><div class="board-layout"><section><div class="section-heading"><h2>${h(t('board'))} <span class="badge"><bdi>${h(filter||t('allDays'))}</bdi> · ${h(t(slot))} · ${ids.length} ${h(t('roles'))}</span></h2><button class="small primary" data-action="newshift">${h(t('addShift'))}</button></div>${ids.map(roleCard).join('')||`<div class="empty"><strong>${h(t('noShifts'))}</strong><button data-action="newshift">${h(t('startShift'))}</button></div>`}<details class="panel"><summary>${h(t('templates'))}</summary><p class="muted">${h(t('templateHint'))}</p><button data-action="templates" data-id="shelter">${h(t('shelter'))}</button> <button data-action="templates" data-id="event">${h(t('event'))}</button></details><section class="card"><h3>${h(t('handover'))} — ${h(t(slot))}</h3><p class="muted">${h(t('appendHint'))}</p>${noteForm()}</section>${notes.slice(0,3).map(noteCard).join('')}${notes.length>3?`<button data-tab="notes">${h(t('notes'))}</button>`:''}</section><aside>${heatmap()}${rosterMini()}<section class="card"><h3>${h(t('recordStore'))}</h3><div class="row"><button class="small" data-action="export">${h(t('json'))}</button><button class="small" data-action="csv">${h(t('csv'))}</button></div><p class="muted">${h(t('exportHint'))}</p></section></aside></div>`;}
function peopleView(){return `<div class="toolbar"><h2>${h(t('people'))}</h2><button class="primary" data-action="newperson">${h(t('addPerson'))}</button></div><p class="warn">${h(t('privacyHelp'))}</p><div class="people-grid spaced">${keys('person').map(id=>{const stat=weekStats(id);return `<article class="card"><div class="section-heading"><h3 dir="auto">${h(personLabel(id))}</h3><span class="badge">${h(t(read('person',id,'active')==='いいえ'?'inactive':'active'))}</span></div><p dir="auto">${h(read('person',id,'skills')||t('noSkills'))}</p><p class="muted">${h(t('available'))}: <bdi>${h(read('person',id,'available')||t('unknown'))}</bdi></p><div class="row"><span class="badge">${h(t('nightLabel'))} ${h(I.state(read('person',id,'night')||'未確認'))}</span><span class="badge">${h(t('selectedWeek'))} ${h(t('count',{n:stat.planned}))} · ${h(t('doneCount',{n:stat.done}))}</span></div><button class="small spaced" data-action="editperson" data-id="${h(id)}">${h(t('editPerson'))}</button></article>`;}).join('')||`<div class="empty">${h(t('noPeople'))}</div>`}</div>`;}
function notesView(){const ids=keys('note').sort((a,b)=>(C.tips(events,'note',b,'text').at(-1)?.clock||0)-(C.tips(events,'note',a,'text').at(-1)?.clock||0));return `<h2>${h(t('notes'))}</h2><p class="muted">${h(t('notesAll'))}</p><section class="card">${noteForm()}</section>${ids.map(noteCard).join('')||`<p class="empty">${h(t('noteNone'))}</p>`}`;}
function fieldLabel(field){return t(({title:'shiftTitle',date:'date',start:'start',end:'end',nextday:'endDay',slot:'band',place:'place',needed:'needed',leader:'leader',memo:'memo',closed:'ended',name:'name',code:'code',skills:'skills',available:'available',active:'active',night:'nightAvail',state:'state',text:'noteText'})[field]||field);}
function conflictLabel(e){if(e.kind==='shift')return read('shift',e.key,'title')||t('unknownName');if(e.kind==='person')return personLabel(e.key);if(e.kind==='duty'){const [sid,pid]=e.key.split('~');return (read('shift',sid,'title')||t('unknownName'))+' / '+personLabel(pid);}return t(e.kind==='site'?'venue':e.kind==='note'?'notes':'acknowledged');}
function displayValue(e){if(e.field==='leader')return personName(e.value);if(['active','night','nextday','closed','state'].includes(e.field)&&e.kind!=='ack')return I.state(e.value);if(e.field==='slot'&&slots[e.value])return t(e.value);return e.value;}
function helpView(){const cf=conflicts();return `<h2>${h(t('helpTitle'))}</h2><section class="card"><h3>${h(t('language'))}</h3><p>${h(t('languageInfo'))}</p></section><section class="card"><h3>${h(t('venue'))}</h3><form data-form="site" data-snap="${snapshot('site','site',['name'])}">${uiInput('name',t('venue'),read('site','site','name'),'text',true)}<button>${h(t('siteSave'))}</button></form></section><section class="card"><h3>${h(t('syncTitle'))}</h3>${['syncHelp','teamHelp','privacyHelp','burdenHelp','nightHelp'].map(key=>`<p>${h(t(key))}</p>`).join('')}</section><section class="card"><h3>${h(t('recordStore'))}</h3><div class="row"><button data-action="export">${h(t('json'))}</button><button data-action="csv">${h(t('csv'))}</button></div><p>${h(t('exportHelp'))}</p></section><section class="card"><h3>${h(t('conflicts'))} ${cf.length}</h3>${!cf.length?`<p>${h(t('noConflicts'))}</p>`:cf.map(({e,t:tips})=>`<section class="warn"><strong><bdi>${h(conflictLabel(e))}</bdi> / ${h(fieldLabel(e.field))}</strong>${tips.map(x=>`<div class="conflict-candidate"><p dir="auto">${h(displayValue(x)||'—')}</p><p class="muted"><bdi>${h(x.actor)}</bdi> · <bdi>${h(formatTime(x.time))}</bdi></p><button class="small" data-action="resolve" data-id="${h(x.id)}" data-parents="${h(JSON.stringify(tips.map(tip=>tip.id)))}">${h(t('chooseValue'))}</button></div>`).join('')}</section>`).join('')}</section><section class="card"><h3>${h(t('history'))}</h3>${Object.values(events).sort((a,b)=>b.clock-a.clock||(a.id<b.id?-1:1)).slice(0,50).map(e=>`<p class="item"><strong><bdi>${h(e.actor)}</bdi></strong> · <bdi>${h(conflictLabel(e))}</bdi> · ${h(fieldLabel(e.field))} → <bdi>${h(displayValue(e))}</bdi><br><small><bdi>${h(formatTime(e.time))}</bdi> · ${h(window.ROTA_PREVIEW?t('demoMode'):pending.includes(e.id)?t('pending',{n:1}):t('saved'))} (${h(t('clock'))})</small></p>`).join('')}</section>`;}
function modalView(){if(!modalId&&!editing)return '';let title='',body='';if(editing==='newperson'||editing.startsWith('person:')){const pid=editing==='newperson'?'':editing.slice(7);title=t(pid?'editPerson':'addPerson');body=personForm(pid);}else if(editing==='newshift'||editing.startsWith('shift:')){const sid=editing==='newshift'?'':editing.slice(6);title=t(sid?'editShift':'saveShift');body=shiftForm(sid);if(sid)body+=`<div class="row spaced"><button data-action="copy" data-id="${h(sid)}">${h(t('copy'))}</button><button data-action="close" data-id="${h(sid)}">${h(t(read('shift',sid,'closed')==='はい'?'reopen':'close'))}</button></div>`;}else{const sid=modalId;title=read('shift',sid,'title')||t('manage');const closed=read('shift',sid,'closed')==='はい',members=[...new Set([...activePeople(),...duties(sid).map(k=>k.split('~')[1])])];body=`<p class="muted"><bdi>${h(read('shift',sid,'date'))} ${h(read('shift',sid,'start'))}–${read('shift',sid,'nextday')==='はい'?h(t('nextDay'))+' ':''}${h(read('shift',sid,'end'))}</bdi> · ${h(t('needCount',{n:needed(sid)}))}</p><p>${h(t('leader'))}: <strong><bdi>${h(personName(read('shift',sid,'leader')))}</bdi></strong></p><p class="muted">${h(t('participantHint'))}</p>${closed?`<p class="warn">${h(t('closedGuard'))}</p>`:''}${members.map(pid=>{const key=sid+'~'+pid,st=read('duty',key,'state'),warn=warnings(sid,pid);return `<div class="roster-line"><div class="row"><strong dir="auto">${h(personLabel(pid))}</strong><span class="badge">${h(st?I.state(st):t('unassigned'))}</span>${pid===read('shift',sid,'leader')?`<span class="badge leader">${h(t('leader'))}</span>`:''}</div><p class="muted" dir="auto">${h(read('person',pid,'skills'))}</p>${warn.length?`<p class="warning-list">⚠ ${warn.map(x=>h(uiWarning(x))).join(' / ')}</p>`:''}<form data-form="duty" data-id="${h(key)}" data-snap="${snapshot('duty',key,['state'])}">${select('state',t('state'),[['',t('unassigned')],...states],st,true)}<button>${h(t('record'))}</button></form></div>`;}).join('')||`<p class="empty">${h(t('noPeople'))}</p>`}`;}
return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title" dir="auto">${h(title)}</h2><button class="small" data-action="dismiss">${h(t('dismiss'))}</button></div>${body}</section></div>`;}
function uiWarning(value){for(const [prefix,key] of [['時間重複：','overlap'],['連続当番：','consecutive']])if(value.startsWith(prefix))return t(key)+' '+value.slice(prefix.length);return value==='活動休止中'?t('inactive'):value==='夜間不可'?t('nightNo'):value;}
function render(){status();document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});const cf=conflicts();let notice=cf.length?`<p class="warn">⚠ ${h(t('conflict',{n:cf.length}))} <button class="small" data-tab="help">${h(t('checkConflict'))}</button></p>`:'';if(!storageOK)notice+=`<p class="warn">${h(t('persistError'))}</p>`;$('#main').innerHTML=demoPanel()+notice+(tab==='shifts'?board():tab==='people'?peopleView():tab==='notes'?notesView():helpView())+`<footer>${h(t('app'))} v1.2.0 · TinyBox / Delta Chat / webxdc</footer>`;$('#modal-root').innerHTML=modalView();document.body.classList.toggle('modal-open',!!modalId||!!editing);}

render();
Promise.resolve(webxdc.setUpdateListener(u=>{if(u.payload?.type!=='rota-v1'||!Array.isArray(u.payload.events))return;for(const e of u.payload.events){if(!C.valid(e))continue;if(!Object.hasOwn(events,e.id))events[e.id]=e;clock=Math.max(clock,e.clock);pending=pending.filter(id=>id!==e.id);}invalidate();persist();status();if(!dirty)render();else message(t('receivedDraft'));},0)).then(()=>{ready=true;status();pump();}).catch(()=>message(t('receiveError')));

}
if(window.webxdc||location.protocol==='file:'){start();return;}
const bridge=document.createElement('script');
bridge.src='webxdc.js';bridge.onload=start;bridge.onerror=start;
document.head.appendChild(bridge);
})();</script>
</body></html>
